name: "Native Tests, AOT Archives And Three-Architecture Containers"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  native-checks:
    uses: ./.github/workflows/native-aot.yaml
    with:
      source-sha: ${{ github.sha }}
      version: 0.0.0-ci
      collect-coverage: true
      include-windows-baseline: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  container-checks:
    uses: ./.github/workflows/container-aot.yaml
    with:
      source-sha: ${{ github.sha }}
      version: 0.0.0-ci
      publish: false
